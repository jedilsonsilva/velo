# Continuous Integration — executa testes unitários (Vitest) em push na main.
# Estrutura pronta para expansão futura (novos jobs: lint, e2e, etc.).

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código no repositório
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Configura o ambiente Node.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # 3. Habilita o Corepack para gerenciamento do yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Executa a suíte de testes unitários (Vitest)
      - name: Run unit tests
        run: yarn test
  
  build-and-delploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código no repositório
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Configura o ambiente Node.js
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # 3. Habilita o Corepack para gerenciamento do yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install
      
      # 5. Obter configurações do Vercel
      - name: Pull Vercel config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # 6. Build para o vercel
      - name: Build Vercel
        run: yarn vercel build --$VERCEL_TOKEN

      # 7. Deploy Preview no Vercel1
      - name: Deploy Preview
        run: yarn vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE