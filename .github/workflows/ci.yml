# Continuous Integration — executa testes unitários (Vitest) em push na main.
# Estrutura pronta para expansão futura (novos jobs: lint, e2e, etc.).

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Obtém o código-fonte do repositório
      - name: Checkout
        uses: actions/checkout@v7

      # Instala a versão do Node definida em NODE_VERSION
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # Habilita o Corepack para usar o Yarn do projeto
      - name: Enable Corepack
        run: corepack enable

      # Instala dependências de forma reproduzível via yarn.lock
      - name: Install dependencies
        run: yarn install

      # Executa a suíte de testes unitários (Vitest)
      - name: Run unit tests
        run: yarn test
